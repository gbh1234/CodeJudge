    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;记录&lt;/th&gt;&lt;th&gt;在哪里 / 用途&lt;/th&gt;&lt;th&gt;与本页快照的关系&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Execution Ledger&lt;/td&gt;&lt;td&gt;Reviewer 内存账本，跟随 agentic-lead-session 保存；包含 model_call_log、tool_call_log、agent_traces 和用量统计。&lt;/td&gt;&lt;td&gt;Checkpoint 中 execution 显示账本位置；这里没有捏造真实调用参数、耗时和Token。PR #5 的最终已知统计单独保留。&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;工具 Observation&lt;/td&gt;&lt;td&gt;一次 BoundedRole 激活中的工具结果；下一步传给模型，可含 evidence_id。启用记忆时还可能写入工作记忆。&lt;/td&gt;&lt;td&gt;不是每次工具调用就独立建外层 Checkpoint；角色中途退出可能重做尚未保存的角色工作。&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;节点尝试 / RuntimeEvent&lt;/td&gt;&lt;td&gt;Runtime 的 started、completed、failed 等执行事件，通过可选 event_sink 输出。&lt;/td&gt;&lt;td&gt;当前 Harness 未给 Runtime 配 event_sink，因此不要误认为这些事件全部写入 trace_events。&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Observability span&lt;/td&gt;&lt;td&gt;review、review.async、runtime.planning 等观测跨度，记录节点执行及耗时；是否导出取决于配置。&lt;/td&gt;&lt;td&gt;不是 Checkpoint，也不是新的业务状态。不会用它决定从哪个阶段恢复。&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;failure_cases / alerts&lt;/td&gt;&lt;td&gt;execution_error 或用户反馈保存到 failure_cases；死信或相关告警保存到 alerts。&lt;/td&gt;&lt;td&gt;本页成功但降级的示例，没有凭空添加一次整个任务失败记录；Worker 失败先在 session 中保存。&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;agent_messages&lt;/td&gt;&lt;td&gt;有对应表和存储接口，但当前主流程并未普遍接入逐条原始消息持久化。&lt;/td&gt;&lt;td&gt;不能看到表名就认定保存了完整 Lead / Worker 对话。&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;队列投递状态&lt;/td&gt;&lt;td&gt;Memory / Redis，含消息、投递次数、消费与ACK；Redis pending 可以被租约回收。&lt;/td&gt;&lt;td&gt;与 tasks.state 独立。任务SUCCESS后，评论仍可能失败、队列仍可能重试。&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
  &lt;/details&gt;
  &lt;details style=&quot;margin-top:12px&quot;&gt;&lt;summary&gt;示例数据与真实记录的边界&lt;/summary&gt;&lt;div class=&quot;text-small&quot; style=&quot;margin-top:8px&quot;&gt;真实已知：PR #5 最终 SUCCESS，整体风险 high，正式 Finding 为 Critical / SEC-EVAL，有 local-rule 与 diff-ast 引用，且一个 specialist Worker 失败。任务 ID、Diff 外围文本、具体委派、失败角色、模型决策、置信度、节点顺序时间和 attempt 均为教学重建；不是读取数据库得到的历史回放。本页采用当前代码的 lead-workers-v3、agentic-summary 和一轮返工上限。业务 Trace step 与 Runtime step 是两个计数；Checkpoint 的 attempt 也不是模型调用次数。&lt;/div&gt;&lt;/details&gt;
  &lt;details style=&quot;margin-top:12px&quot;&gt;&lt;summary&gt;错误与恢复：完整决策规则&lt;/summary&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;如果发生&lt;/th&gt;&lt;th&gt;怎样处理&lt;/th&gt;&lt;th&gt;留下什么&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;入口签名无效、事件过期&lt;/td&gt;&lt;td&gt;入口拒绝请求，不进入 Runtime。Webhook 过期检查与执行时间预算不是同一个机制。&lt;/td&gt;&lt;td&gt;不会产生本次审查的节点 Checkpoint&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;普通节点异常&lt;/td&gt;&lt;td&gt;Runtime 在本次预算内重新调用当前 handler；默认初次加2次重试。没有指数退避等待；也不必重新读取外层 Checkpoint。&lt;/td&gt;&lt;td&gt;当前节点 failed Checkpoint，state 为 {}，保存 attempt 和 error；旧内层会话成果可保留&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;ValueError / 取消 / RuntimeBudgetExceeded&lt;/td&gt;&lt;td&gt;本次 Runtime 不进行节点重试，异常交给 Harness。外层队列是否再投递是另一层策略。&lt;/td&gt;&lt;td&gt;Harness 写 FAILED 或 CANCELLED Trace；普通失败尝试记录 failure_cases，当前不可重试分支不写新的 failed 节点 Checkpoint&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;一个 Worker 失败&lt;/td&gt;&lt;td&gt;记录 Worker 失败，不直接让 executing 失败；Lead 可以根据其他成果继续，或在允许范围内返工。&lt;/td&gt;&lt;td&gt;agentic-lead-session.worker_results 中 status=failed、error；最终报告可以 SUCCESS 但标为 degraded&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;整个进程突然退出&lt;/td&gt;&lt;td&gt;当前运行无法自动继续，通常来不及做异常收尾。进程重启后由 resume 或持久队列重新交付任务。&lt;/td&gt;&lt;td&gt;内存丢失，已提交到数据库的成果保留；tasks.state 可能停在 EXECUTING&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;只有 planning completed&lt;/td&gt;&lt;td&gt;恢复 parsed，跳过 planning；重新进入 executing，再检查内层 session。&lt;/td&gt;&lt;td&gt;没有第二条 PLANNING Trace；新 executing 尝试可能追加新的 EXECUTING Trace&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;内层 Worker 已保存，但 executing 未完成&lt;/td&gt;&lt;td&gt;复用 Scanner、委派、已有 Worker 结果，从后续未完成阶段继续；保存为 failed 的 Worker 也不会被初始待执行列表自动重新跑。&lt;/td&gt;&lt;td&gt;旧调用账本恢复，最终统计包含中断前的调用&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;report Checkpoint 完成，SUCCESS 尚未落库&lt;/td&gt;&lt;td&gt;三个外层节点都跳过；Harness 恢复报告，再完成 SUCCESS 和报告落库。&lt;/td&gt;&lt;td&gt;无需重新调用模型；tasks.report_json 最终写入&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;SUCCESS 后评论失败&lt;/td&gt;&lt;td&gt;队列可重试；Harness 返回旧报告，重新尝试评论 Upsert。&lt;/td&gt;&lt;td&gt;任务仍可为 SUCCESS；评论结果与审查成功是不同层次&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;新旧输入不一致&lt;/td&gt;&lt;td&gt;不能给同一 task ID 换一份 Diff 来恢复；当前 Harness 不比较 Diff 哈希。&lt;/td&gt;&lt;td&gt;正常 Service 保存原 Diff；SHA-256 元数据不等于恢复时做一致性验证&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;p&gt;重新进入 execute() 会获得新的步数与时间预算。外层 Checkpoint 的 attempt 只会从已保存的编号继续累加：如果进程在第一次 executing 中直接退出，且外层还没有保存 attempt，下次编号可能仍从1开始。&lt;/p&gt;
    &lt;p&gt;本地 memory-acked 队列及其死信记录不跨进程持久化；Redis Streams 才能保留队列消息。数据库 Checkpoint 保存了成果，不代表进程重启后一定自动调度所有未完成任务。&lt;/p&gt;
  &lt;/details&gt;
  &lt;details style=&quot;margin-top:12px&quot;&gt;&lt;summary&gt;源码索引与文档差异&lt;/summary&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;源码文件&lt;/th&gt;&lt;th&gt;重点阅读位置&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;evoagent/api.py&lt;/td&gt;&lt;td&gt;HTTP 入口、认证与 GitHub Webhook 校验&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/service.py&lt;/td&gt;&lt;td&gt;create_review、handle_github_pull_request、_process_queued、_run_review、resume_task&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/harness.py&lt;/td&gt;&lt;td&gt;ReviewHarness.run、_planning、_executing、_reviewing、_transition&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/runtime.py&lt;/td&gt;&lt;td&gt;AgentRuntime.execute、ToolRegistry.invoke&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/agentic_core.py&lt;/td&gt;&lt;td&gt;BoundedRole.run、_agentic、_run_pending_assignments、_load_lead_session、_save_lead_session&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/llm.py&lt;/td&gt;&lt;td&gt;complete_json、_parse_json_object&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/gates.py&lt;/td&gt;&lt;td&gt;FindingGate.apply&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/store.py&lt;/td&gt;&lt;td&gt;create、transition、succeed、fail、save_checkpoint、load_checkpoints&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;evoagent/task_queue.py / github.py&lt;/td&gt;&lt;td&gt;投递、重试、ACK、死信；评论 Upsert&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;基于本次已核对的当前代码：Service 直接装配 AgenticReviewer；摘要名为 agentic-summary；内层协议 lead-workers-v3；高风险最多1轮返工；Lead 和 Critic 当前不开放工具。旧文档中的 ModeRouterReviewer、mode-router-summary、v1 和两轮返工不能直接套用。&lt;/p&gt;&lt;/details&gt;
